# JDK 26 (текущий системный JAVA_HOME) не распознаётся встроенным компилятором
# Kotlin 2.1.x (баг парсинга версии для будущих релизов JDK: JavaVersion.parse
# падает на "26.0.1"). jvmToolchain(21) в build.gradle.kts задаёт JDK только для
# самой сборки кода, а демон Kotlin-компилятора всё равно наследует JVM самого
# Gradle-демона — поэтому здесь явно фиксируем JDK 21 и для него.
org.gradle.java.home=C:/Users/slava/.jdks/jbr-21.0.11
org.gradle.java.installations.paths=C:/Users/slava/.jdks/jbr-21.0.11
org.gradle.java.installations.auto-detect=true
